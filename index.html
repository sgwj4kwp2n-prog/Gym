<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калории">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Счётчик калорий</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 12px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    color: #333;
    font-size: 16px;
    overscroll-behavior: none;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; margin-bottom: 16px; color: #667eea; font-size: 22px; }
  .goal-section {
    background: #f8f9ff;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .goal-section input {
    flex: 1;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    width: 100%;
  }
  .progress-bar {
    height: 32px;
    background: #e0e0e0;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 10px;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4CAF50, #8BC34A);
    transition: width 0.5s ease;
  }
  .progress-text {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #333;
    font-size: 13px;
    text-shadow: 0 0 3px white;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    background: #f8f9ff;
    padding: 12px 6px;
    border-radius: 10px;
    text-align: center;
  }
  .stat-value { font-size: 20px; font-weight: bold; color: #667eea; }
  .stat-label { font-size: 11px; color: #888; margin-top: 3px; }
  .add-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .add-form input, .add-form button {
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    width: 100%;
  }
  .add-form input[name="name"] { grid-column: 1 / -1; }
  .add-form button {
    background: #667eea;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
    grid-column: 1 / -1;
    font-size: 17px;
  }
  .add-form button:active { background: #5568d3; transform: scale(0.98); }
  .food-list { max-height: 45vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .food-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: #f8f9ff;
    border-radius: 10px;
    margin-bottom: 8px;
    gap: 8px;
  }
  .food-info { flex: 1; min-width: 0; }
  .food-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .food-details { font-size: 12px; color: #888; margin-top: 2px; }
  .food-cal { font-weight: bold; color: #667eea; font-size: 14px; white-space: nowrap; }
  .delete-btn {
    background: #ff4757;
    color: white;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
  }
  .delete-btn:active { background: #ee2c3e; }
  .empty { text-align: center; color: #888; padding: 30px; font-size: 14px; }
  .reset-btn {
    width: 100%;
    padding: 14px;
    background: #ff4757;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 12px;
    font-weight: bold;
    font-size: 15px;
  }
  .reset-btn:active { background: #ee2c3e; }
  .tips { font-size: 11px; color: #888; text-align: center; margin-top: 8px; }

  @media (max-width: 380px) {
    .stat-value { font-size: 18px; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🍎 Счётчик калорий</h1>

  <div class="goal-section">
    <label>Цель:</label>
    <input type="number" id="goal" value="2000" min="500" max="10000" inputmode="numeric">
    <span>ккал</span>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    <div class="progress-text" id="progressText">0 / 2000 ккал</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="totalCal">0</div>
      <div class="stat-label">Съедено</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="remainingCal">2000</div>
      <div class="stat-label">Осталось</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="itemCount">0</div>
      <div class="stat-label">Продуктов</div>
    </div>
  </div>

  <form class="add-form" onsubmit="event.preventDefault(); addFood();">
    <input type="text" id="foodName" name="name" placeholder="Название продукта" maxlength="50" autocomplete="off">
    <input type="number" id="foodWeight" placeholder="Вес (г)" min="1" value="100" inputmode="numeric">
    <input type="number" id="foodCal" placeholder="Ккал/100г" min="0" inputmode="numeric">
    <button type="submit">+ Добавить</button>
  </form>

  <div class="food-list" id="foodList">
    <div class="empty">Пока ничего не добавлено</div>
  </div>

  <button class="reset-btn" onclick="resetDay()">🗑️ Сбросить день</button>
  <p class="tips">Данные сохраняются на телефоне</p>
</div>

<script>
  const STORAGE_KEY = 'calorieTracker';
  let foods = [];
  let goal = 2000;

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      foods = data.foods || [];
      goal = data.goal || 2000;
    } catch(e) { foods = []; goal = 2000; }
    document.getElementById('goal').value = goal;
    render();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ foods, goal }));
  }

  function addFood() {
    const name = document.getElementById('foodName').value.trim();
    const weight = parseFloat(document.getElementById('foodWeight').value);
    const calPer100 = parseFloat(document.getElementById('foodCal').value);

    if (!name) return alert('Введите название продукта');
    if (!weight || weight <= 0) return alert('Введите корректный вес');
    if (isNaN(calPer100) || calPer100 < 0) return alert('Введите калорийность');

    const totalCal = Math.round((calPer100 * weight) / 100);
    foods.push({ id: Date.now(), name, weight, calPer100, totalCal });

    document.getElementById('foodName').value = '';
    document.getElementById('foodWeight').value = '100';
    document.getElementById('foodCal').value = '';
    document.getElementById('foodName').focus();

    save();
    render();
  }

  function removeFood(id) {
    foods = foods.filter(f => f.id !== id);
    save();
    render();
  }

  function resetDay() {
    if (confirm('Сбросить все записи за день?')) {
      foods = [];
      save();
      render();
    }
  }

  function updateGoal(val) {
    goal = Math.max(500, Math.min(10000, parseInt(val) || 2000));
    save();
    render();
  }

  function render() {
    const total = foods.reduce((s, f) => s + f.totalCal, 0);
    const remaining = goal - total;
    const percent = Math.min(100, (total / goal) * 100);

    document.getElementById('totalCal').textContent = total;
    document.getElementById('remainingCal').textContent = remaining;
    document.getElementById('itemCount').textContent = foods.length;

    const fill = document.getElementById('progressFill');
    fill.style.width = percent + '%';
    fill.style.background = percent >= 100
      ? 'linear-gradient(90deg, #ff4757, #ff6b81)'
      : 'linear-gradient(90deg, #4CAF50, #8BC34A)';

    document.getElementById('progressText').textContent =
      `${total} / ${goal} ккал (${Math.round(percent)}%)`;

    const list = document.getElementById('foodList');
    if (foods.length === 0) {
      list.innerHTML = '<div class="empty">Пока ничего не добавлено</div>';
      return;
    }

    list.innerHTML = foods.map(f => `
      <div class="food-item">
        <div class="food-info">
          <div class="food-name">${escapeHtml(f.name)}</div>
          <div class="food-details">${f.weight} г · ${f.calPer100} ккал/100г</div>
        </div>
        <span class="food-cal">${f.totalCal} ккал</span>
        <button class="delete-btn" onclick="removeFood(${f.id})">×</button>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  document.getElementById('goal').addEventListener('change', e => updateGoal(e.target.value));

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  load();
</script>
</body>
</html>
